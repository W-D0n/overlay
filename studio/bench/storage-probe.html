<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Sonde Browser Source</title>
  <!--
    Mesure dans une Browser Source OBS : (1) si le stockage (localStorage) survit à un redémarrage d'OBS
    (docs/specs/socle-rendu-etapes-1-2.md §1b) ; (2) le ratio de pixels (devicePixelRatio) et la taille
    de la page, qui décident si le réglage de qualité de rendu sert à quelque chose.
    À charger dans une Browser Source de test, jamais dans la source du live.
  -->
  <style>
    body { margin: 0; padding: 24px; background: #111; color: #eee; font: 28px/1.5 'Courier New', monospace; }
  </style>
</head>
<body>
  <div id="out">…</div>
  <script>
    const KEY = 'overlay:storage-probe';
    const lines = [];
    try {
      const previous = JSON.parse(localStorage.getItem(KEY) ?? 'null');
      const state = previous ?? { firstSeen: new Date().toISOString(), loads: 0 };
      state.loads += 1;
      localStorage.setItem(KEY, JSON.stringify(state));
      lines.push(previous === null ? 'PREMIÈRE visite : rien de mémorisé' : 'MÉMORISÉ depuis la première visite');
      lines.push(`première visite : ${state.firstSeen}`);
      lines.push(`chargements : ${state.loads}`);
    } catch (error) {
      lines.push(`stockage indisponible : ${error.name}`);
    }
    lines.push(`devicePixelRatio : ${window.devicePixelRatio}`);
    lines.push(`page : ${window.innerWidth}×${window.innerHeight}`);
    document.getElementById('out').innerHTML = lines.map((line) => `<div>${line}</div>`).join('');
  </script>
</body>
</html>
