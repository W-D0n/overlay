[package]
name = "overlay-studio"
version = "0.1.0"
edition = "2021"

# Coquille : panneau de contrôle (ui/) qui lance et arrête `bun server/lifecycle/start-stream.js` et ouvre studio/index.html (docs/specs/controle-processus.md).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "overlay-studio"
path = "src/main.rs"
