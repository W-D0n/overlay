<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay — Fond seul</title>
  <!--
    URL OBS background-only (docs/specs/background-standalone.md) : ne rend QUE l'effet de fond
    courant, piloté par dev/background-state-server.js (port 5932). État chargé au démarrage (GET /state), puis suivi en live via
    WS /state-ws — serveur injoignable : page vide + reconnexion avec backoff, jamais d'erreur
    visible dans la Browser Source.
    OBS : la page épouse la taille de la Browser Source, quelle qu'elle soit ; pointer-events: none.
    Option "?transparent=1" : force le body en transparent (au lieu du noir Atelier) pour
    superposer l'animation au-dessus d'autres sources OBS (gameplay, cam).
  -->
  <link rel="stylesheet" href="./tokens.css">
  <style>
    body.transparent { background-color: transparent; }

    #bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>

  <script type="module">
    import { createSceneRuntime } from './scene-runtime.js';
    import { sceneForBrandingMode, sceneFromCurrent } from './scene-doc.js';
    import { brandingContent } from './branding-content.js';
    import { liveSceneOf, selectScene } from './background-selection.js';
    import { ReactionOverlay } from './components/ReactionOverlay.js';
    import { createReactionCoordinator } from './background-reactions.js';
    import { createBrowserAudioSession } from './background-audio.js';
    import { BACKGROUND_STATE_PORT } from './ports.config.js';
    import { parseRenderUrl } from './render-url.js';
    import { createLocalTransport } from './render-transport.js';

    // `only` : couche d'identité seule, à poser sur une cam ou un gameplay. `off` : fond seul.
    const { presetRef, branding: brandingMode, transparent, role } = parseRenderUrl(location.search);

    if (transparent) document.body.classList.add('transparent');

    const bgLayer = document.getElementById('bg-layer');
    // La session audio se resynchronise sur chaque changement d'effet monté : un preset non
    // réactif n'ouvre jamais le micro (docs/specs/background-audio-reactivity.md).
    let audio = null;
    const mount = createSceneRuntime(bgLayer, { onMountChange: () => audio?.sync() });
    audio = createBrowserAudioSession({ mount });
    audio.sync();
    mount.setPaused(document.hidden);
    document.addEventListener('visibilitychange', () => mount.setPaused(document.hidden));

    // Réactions : overlay partagé (au-dessus de l'effet) + routage natif/overlay.
    const overlay = ReactionOverlay();
    bgLayer.appendChild(overlay.el);
    const coordinator = createReactionCoordinator({ mount, overlay });

    /**
     * Le branding est une couche de la scène (sa visibilité appartient au preset affiché : un preset qui le masque n'en a
     * pas) ; son contenu est global, déposé dans `brandingContent` par son canal. `?branding=` filtre ces couches.
     */
    function render(scene) {
      mount.apply(sceneForBrandingMode(scene, brandingMode));
    }

    function applySafely(scene) {
      try {
        render(scene);
      } catch (err) {
        // État illisible : on garde le fond en place plutôt qu'un écran vide en live, et on trace
        // pour diagnostic. Un effet inconnu est déjà géré par le moteur de scène (couche signalée, fond conservé).
        console.error('[background] état non applicable :', err);
      }
    }

    const transport = createLocalTransport({
      baseUrl: `http://localhost:${BACKGROUND_STATE_PORT}`,
      presetRef,
      role,
    });

    transport.subscribe({
      onState(file) {
        brandingContent.set(file.branding);
        const selected = selectScene(file, presetRef);
        if (selected === null) {
          applySafely(sceneFromCurrent({ component: null, options: {} }));
          console.error(`[background] preset inconnu : ${presetRef}`);
          return;
        }
        applySafely(selected);
      },
      onCurrent: (message) => applySafely(liveSceneOf(message)),
      // Contenu du branding : canal séparé, global, indépendant du preset et de l'effet.
      ...(brandingMode === 'off' ? {} : { onBranding: (next) => brandingContent.set(next) }),
      // Réactions : canal actif quel que soit le mode (courant ou preset).
      onEvent: coordinator.handle,
      onError: (err) => console.error('[background] transport :', err),
    });
  </script>
</body>
</html>
